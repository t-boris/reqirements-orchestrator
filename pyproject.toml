[project]
name = "maro"
version = "2.0.0"
description = "Multi-Agent Requirements Orchestrator - Slack bot for transforming conversations into work items"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "eventsourcing>=9.5.0",
    "eventsourcing-sqlalchemy>=0.6.0",
    "orjson>=3.9.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "slack-bolt>=1.27.0",
    "aiohttp>=3.9.0",
    "litellm>=1.57",
    "instructor>=1.8",
    "json-repair>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.98.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
